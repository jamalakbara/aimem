name: Git claim stress

on:
  pull_request:
    paths:
      - ".github/workflows/claims-stress.yml"
      - "packages/core/src/claims/**"
      - "packages/core/src/git/**"
      - "packages/core/test/claim-acquire.test.ts"
      - "packages/schema/src/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * *"

permissions:
  contents: read

jobs:
  stress:
    name: 20 clones / five tasks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIMEM_CLAIM_STRESS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/core/test/claim-acquire.test.ts -t "20 clones"
