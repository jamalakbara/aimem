name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Validate this repo's own notebook (docs/11 §6)
        run: node packages/cli/dist/bin.js validate --strict

  server:
    # Database tests of the sync server (plan 6.1 §7.2). They never skip: without PostgreSQL they fail.
    name: server (postgres 16 / node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: aimem
          POSTGRES_PASSWORD: aimem-ci-only
          POSTGRES_DB: aimem
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aimem" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      AIMEM_REQUIRE_TEST_DB: "1"
      AIMEM_TEST_DATABASE_URL: postgres://aimem:aimem-ci-only@localhost:5432/aimem
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -s build
      - name: Server database tests
        run: pnpm exec vitest run --config vitest.server.config.ts --reporter=default --reporter=json --outputFile.json=server-report.json
      - name: Fail unless the tests really ran (none skipped)
        if: always()
        run: node packages/server/scripts/check-report.mjs server-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-report
          path: server-report.json
          retention-days: 14

  server-mutation:
    # Deliberate breakages must each be caught (plan 6.1 §7.2, CI-3).
    name: server mutations (postgres 16 / node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: aimem
          POSTGRES_PASSWORD: aimem-ci-only
          POSTGRES_DB: aimem
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aimem" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      AIMEM_REQUIRE_TEST_DB: "1"
      AIMEM_TEST_DATABASE_URL: postgres://aimem:aimem-ci-only@localhost:5432/aimem
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -s build
      - run: node packages/server/scripts/mutate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: mutation-report.md
          retention-days: 14

  p95:
    # Claim visibility p95 in a simulation (plan 6.1 §8, P95-1). NOT a required check: it becomes one only after
    # 5 green runs in a row on the same head, and its result is "passed in simulation" at best (docs/13 M6 stays
    # unchecked). The JSON report is uploaded also when the run fails.
    name: p95 simulation (postgres 16 / node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: aimem
          POSTGRES_PASSWORD: aimem-ci-only
          POSTGRES_DB: aimem
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aimem" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://aimem:aimem-ci-only@localhost:5432/aimem
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -s build
      - name: Measure claim visibility (three profiles, 20 + 300 samples each)
        run: node packages/server/bench/claim-visibility.ts --out p95-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p95-report
          path: p95-report.json
          retention-days: 30

  viewer-browser:
    name: viewer in a browser (ubuntu-latest / node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: axe, keyboard, zoom, Markdown and read-only (docs/24 §5.8)
        run: pnpm test:e2e
      - name: Time budget on 5,000 records, alone (docs/24 §5.8)
        run: pnpm test:budget
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: viewer-browser-results
          path: test-results
          retention-days: 7
