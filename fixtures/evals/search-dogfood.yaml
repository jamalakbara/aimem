    summary: Inspected baseline scoring and prepared a plan for testing.
    body: |
      ## Done
      Inspected the baseline, scoring and real-model gate.
      ## Not done
      Scoring changes and a fresh model run.
      ## Next
      Reproduce the baseline, inspect misses, add regression tests and report eval deltas.
      ## Blocked
