# Sanitized technical excerpts from aimem dogfooding notes; authored before the ranking change.
# Semantic scores are deterministic PR-test inputs, not model-quality claims.
records:
  - id: mem-g48me62t
    type: memory
    title: How to build, test and evaluate
    summary: Run pnpm build, pnpm lint, pnpm typecheck and pnpm test; pnpm eval measures retrieval quality.
    body: |
      Setup uses pnpm install. Build with pnpm build.
      Before committing run pnpm lint, pnpm typecheck and pnpm test.
      Tests build the workspace first and exercise the built binary.
      Run pnpm eval for retrieval quality; the real-model tier is optional.
  - id: hnd-8f3zwsag
    type: handoff
    title: Session results from the reranking experiment
    summary: Completed an experiment with held-out questions and recorded test results.
    body: |
      ## Done
      Completed an eval-only reranking experiment. Test questions were committed before runs.
      The held-out tests had no forbidden references. Lint and typecheck passed.
      ## Not done
      Production ranking, adversarial tests and bounded prompts.
      ## Next
      Review the experiment, then plan the optional ranking slice and run tests.
      ## Blocked
      none
      ## Notes for next agent
      Results on one corpus do not establish generalization.
  - id: hnd-thyjj57w
    type: handoff
